services:
  backend:
    image: sunset-hotel-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunset-hotel-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=sunset_kuakata_jwt_secret_key_2026_super_secure
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      # Persist SQLite database file across container restarts
      - backend-db:/app/prisma

volumes:
  backend-db:
    driver: local
